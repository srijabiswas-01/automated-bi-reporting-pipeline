<script>
'use strict';
const state={data:{},model:{},actor:{},page:'Dashboard',pages:{},editing:{}};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function notice(text,error=false){$('#notice').textContent=text;$('#notice').className=error?'error':'';}
function rpc(action,payload={}){return new Promise((resolve,reject)=>{if(!window.google || !google.script){reject(new Error('Open the deployed Apps Script web app to connect to your Google Sheet.'));return;}google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action,payload);});}
async function refresh(){notice('Loading records…');try{const result=await rpc('bootstrap');Object.assign(state,result);$('#identity').textContent=result.actor.role;$('#sidebar-identity').textContent=result.actor.email;$('#freshness').textContent='Updated '+new Date(result.refreshed_at).toLocaleTimeString();$$('[data-admin]').forEach(n=>n.hidden=result.actor.role!=='administrator');renderKpis();showPage(state.page);notice('');}catch(e){notice(e.message,true);}}
function start(){document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){showPage(b.dataset.page);$('.sidebar').classList.remove('open');}});$('#refresh').onclick=refresh;$('#menu-toggle').onclick=()=>$('.sidebar').classList.toggle('open');$$('.table-search').forEach(n=>n.oninput=()=>{state.pages[state.page]=0;renderTable();});$$('.export-table').forEach(b=>b.onclick=()=>exportCSV(currentTable()));$('#export-csv').onclick=()=>exportCSV($('#export-table').value);$('#admin-table').onchange=()=>{state.editing={};showPage('Users');};refresh();}
function currentTable(){return state.page==='Users'?$('#admin-table').value:$('#page-'+state.page).dataset.table;}
function showPage(name){const page=$('#page-'+name);if(!page)return;state.page=name;$$('.page').forEach(n=>n.hidden=n!==page);$$('nav [data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===name));if(page.dataset.table)renderTable();if(page.dataset.form){if(page.dataset.form==='master')renderMaster(page,currentTable());else if(['ProductForm','CustomerForm','SupplierForm'].includes(page.dataset.form)){const host=page.querySelector('.form-host');host.replaceChildren();const b=el('button','Add new record','primary');b.onclick=()=>{state.editing={};showPage(page.dataset.form);};host.append(b);}else renderTransaction(page.querySelector('.form-host'),page.dataset.form);}if(name==='Inventory')renderTransaction($('#transfer-form'),'transfer');if(name==='Returns')renderTransaction($('#refund-form'),'refund');if(name==='Reports'){const select=$('#export-table');select.replaceChildren();Object.keys(state.data).forEach(t=>{const o=el('option',t);o.value=t;select.append(o);});}}
function renderKpis(){const k=state.kpis, currency=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n);['#kpis','#report-kpis'].forEach(selector=>{const host=$(selector);host.replaceChildren();[['Net sales',currency(k.net_sales),'Completed sales less accepted returns'],['Gross profit',currency(k.gross_profit),'Original cost snapshots'],['Completed orders',k.orders,'Payment tracked separately'],['Active products',k.active_products,k.low_stock+' stock lines need attention']].forEach(([title,value,desc])=>{const card=el('div',undefined,'kpi');card.append(el('span',title),el('strong',value),el('small',desc));host.append(card);});});const low=state.data.inventory_balances.filter(b=>Number(b.quantity_on_hand)-Number(b.quantity_reserved)<=Number(b.reorder_point));$('#low-stock').textContent=low.length?low.map(b=>labelFor('products',b.product_id)+' · '+labelFor('stores',b.store_id)+' · available '+(b.quantity_on_hand-b.quantity_reserved)).join(' | '):'All stocked products are above their reorder points.';}
function renderTable(){const page=$('#page-'+state.page),host=page.querySelector('.table-host'),table=currentTable();if(!host)return;const query=(page.querySelector('.table-search').value || '').toLowerCase(),rows=(state.data[table] || []).filter(r=>JSON.stringify(r).toLowerCase().includes(query));const columns=(state.model[table] || []).map(f=>f.name).filter(k=>!['created_at','updated_at','version','is_active','before_data','after_data'].includes(k));host.replaceChildren();if(!rows.length){host.append(el('div','No records found.','empty'));page.querySelector('.pagination').replaceChildren();return;}const grid=el('table'),head=el('tr');columns.forEach(c=>head.append(el('th',c.replaceAll('_',' '))));head.append(el('th','Actions'));const thead=el('thead');thead.append(head);grid.append(thead);const body=el('tbody'),index=state.pages[state.page] || 0;rows.slice(index*15,index*15+15).forEach(row=>{const tr=el('tr');columns.forEach(c=>tr.append(el('td',String(row[c] ?? ''))));const actions=el('td'),details=el('button','View');details.onclick=()=>{$('#record-details').textContent=JSON.stringify(row,null,2);$('#details-dialog').showModal();};actions.append(details);if(['products','customers','suppliers','categories','users','roles','stores','brands','segments','customer_addresses'].includes(table)){const edit=el('button','Edit');edit.onclick=()=>{state.editing={table:table,row:row};showPage(({products:'ProductForm',customers:'CustomerForm',suppliers:'SupplierForm'})[table] || state.page);};actions.append(edit);}tr.append(actions);body.append(tr);});grid.append(body);host.append(grid);const pagination=page.querySelector('.pagination');pagination.replaceChildren();const prev=el('button','Previous'),next=el('button','Next');prev.disabled=index===0;next.disabled=(index+1)*15>=rows.length;prev.onclick=()=>{state.pages[state.page]=index-1;renderTable();};next.onclick=()=>{state.pages[state.page]=index+1;renderTable();};pagination.append(prev,el('span',`${index*15+1}–${Math.min((index+1)*15,rows.length)} of ${rows.length}`),next);}
function exportCSV(table){const rows=state.data[table] || [],headers=(state.model[table] || []).map(f=>f.name);function quote(v){let s=String(v ?? '');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}const csv=[headers.map(quote).join(','),...rows.map(r=>headers.map(k=>quote(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=el('a');a.href=url;a.download=table+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function labelFor(table,value){const r=(state.data[table] || []).find(r=>Object.values(r).includes(value));return r?(r.product_name || r.store_name || r.full_name || r.supplier_name || r.category_name || value):value;}
function field(def,value){const label=el('label',def.label || def.name.replaceAll('_',' '));let input;if(def.options || def.table){input=el('select');const blank=el('option','Select…');blank.value='';input.append(blank);const options=def.table?(state.data[def.table] || []).filter(r=>r.is_active!==false).map(r=>[r[def.key],labelFor(def.table,r[def.key])]):def.options.map(v=>[v,v]);options.forEach(([id,title])=>{const o=el('option',String(title));o.value=id;input.append(o);});}else{input=el('input');input.type=def.type || 'text';if(input.type==='number'){input.step=def.step || '0.01';if(def.min!==undefined)input.min=def.min;}}input.name=def.name;input.required=!!def.required;if(input.type==='checkbox')input.checked=value===true;else input.value=value ?? def.default ?? '';label.append(input);return label;}
async function submitOperation(form,action,payload){const button=form.querySelector('[type=submit]');button.disabled=true;form.dataset.requestId ||= crypto.randomUUID();payload.request_id=form.dataset.requestId;notice('Saving…');try{const result=await rpc(action,payload);notice(result.message);state.editing={};await refresh();notice('Saved successfully. Reference: '+result.result.id);}catch(e){notice(e.message,true);}finally{button.disabled=false;}}
</script>

<script>
function renderTransaction(host,action){host.replaceChildren();const form=el('form'),grid=el('div',undefined,'form-grid');(transactionFields[action] || []).forEach(def=>grid.append(field(def)));form.append(grid);if(transactionLines[action]){form.append(el('h3','Line items'));const lines=el('div',undefined,'line-items');function addLine(){const row=el('div',undefined,'line-row');transactionLines[action].forEach(def=>row.append(field(def)));const remove=el('button','Remove');remove.type='button';remove.onclick=()=>row.remove();row.append(remove);lines.append(row);}const add=el('button','+ Add line');add.type='button';add.onclick=addLine;form.append(lines,add);addLine();}const actions=el('div',undefined,'form-actions'),save=el('button','Save '+action.replace(/([A-Z])/g,' $1').toLowerCase(),'primary');save.type='submit';actions.append(save);form.append(actions);form.onsubmit=e=>{e.preventDefault();const payload={};grid.querySelectorAll('input,select').forEach(n=>payload[n.name]=n.type==='checkbox'?n.checked:n.value);if(transactionLines[action])payload.items=Array.from(form.querySelectorAll('.line-row')).map(row=>{const item={};row.querySelectorAll('input,select').forEach(n=>item[n.name]=n.type==='checkbox'?n.checked:n.value);return item;});submitOperation(form,action,payload);};host.append(form);}
</script>

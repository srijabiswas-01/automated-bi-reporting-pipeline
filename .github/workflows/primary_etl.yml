name: Primary daily retail ETL
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      period:
        description: 'Reporting date YYYY-MM-DD (blank means current UTC date)'
        required: false
        type: string
      force:
        description: 'Recheck a successful period'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: superstore-primary-etl
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ETL_SOURCE: sheets
      REQUESTED_PERIOD: ${{ inputs.period }}
      FORCE_RUN: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Synchronize with bounded retries
        shell: bash
        run: |
          args=(--orchestrator github)
          if [ -n "$REQUESTED_PERIOD" ]; then args+=(--period "$REQUESTED_PERIOD"); fi
          if [ "$FORCE_RUN" = "true" ]; then args+=(--force); fi
          for attempt in 1 2 3; do
            if python -m etl.pipeline "${args[@]}"; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1

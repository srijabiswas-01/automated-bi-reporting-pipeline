name: Automatic retail snapshot to Neon
on:
  push:
    paths:
      - 'operational/snapshot.json.gz'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      period:
        description: 'Reporting date YYYY-MM-DD (blank means current UTC date)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: superstore-primary-etl
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ETL_SOURCE: snapshot
      SNAPSHOT_PATH: operational/snapshot.json.gz
      SNAPSHOT_MAX_AGE_HOURS: '26'
      REQUESTED_PERIOD: ${{ inputs.period }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Synchronize with bounded retries
        shell: bash
        run: |
          args=(--orchestrator github --force)
          if [ -n "$REQUESTED_PERIOD" ]; then args+=(--period "$REQUESTED_PERIOD"); fi
          for attempt in 1 2 3; do
            if python -m etl.pipeline "${args[@]}"; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1
